[project]
name = "office-tt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2",
  "jinja2>=3.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Camera and sensor workers (app/devices). System libs: libegl1, libportaudio2.
devices = ["opencv-contrib-python>=4.8", "mediapipe>=0.10.14", "sounddevice>=0.4", "pyserial>=3.5"]

[tool.setuptools]
packages = ["app", "app.devices"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
